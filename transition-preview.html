<!doctype html><html lang="en"><meta charset="utf-8"><title>Pixel transition</title><style>body{background:#151515;color:#eee;font:16px system-ui;padding:32px}#demo{position:relative;width:min(900px,90vw);height:400px;overflow:hidden;background:#252525;display:grid;place-items:center;border-radius:12px}#overlay{position:absolute;inset:0;overflow:hidden}.mka-pixel-cell{position:absolute;display:block;background:#141414;transform:scale(0);transform-origin:center}button{margin:16px 0;padding:10px 18px}</style><h1>Pixel transition</h1><div id="demo"><h2 id="label">Main stage A</h2><div id="overlay" hidden></div></div><button id="play">Switch stage</button><script src="pixel-transition.js"></script><script>let a=true;play.onclick=async()=>{play.disabled=true;overlay.hidden=false;let e=MKAPixelTransition.create(overlay);await e.animate(true);a=!a;label.textContent=a?'Main stage A':'Main stage B';await e.animate(false);overlay.hidden=true;play.disabled=false}</script></html>
