<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>MKA’s mixtape</title><style>@import url('https://fonts.googleapis.com/css2?family=Zalando+Sans:wght@400;500;600&display=swap');
*{box-sizing:border-box}
:root{color-scheme:dark}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff}
body{overscroll-behavior:none;touch-action:manipulation;font-family:"Zalando Sans",Arial,Helvetica,sans-serif}
#viewport{position:fixed;inset:0;background:#000;overflow:hidden;isolation:isolate;border-radius:12px;clip-path:inset(0 round 12px)}
#stage{position:absolute;left:50%;top:50%;width:1602px;height:710px;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center center}
#tape{position:absolute;inset:0;transform:translate3d(0,860px,0);opacity:1;will-change:transform;pointer-events:none;transition:transform 1450ms cubic-bezier(.19,1,.22,1)}
#stage.open #tape{transform:translate3d(0,0,0);pointer-events:auto}
#cassette-art{position:absolute;inset:0;width:1602px;height:727px;overflow:visible;shape-rendering:geometricPrecision}
#mka-reel-left{transform-origin:652.289px 294.285px}
#mka-reel-right{transform-origin:949.969px 294.285px}
.mka-reel-hub{transform-box:view-box;animation:hubRotate 2600ms linear infinite;animation-play-state:paused;will-change:transform}
#stage.playing .mka-reel-hub{animation-play-state:running}
@keyframes hubRotate{to{transform:rotate(360deg)}}
.mka-eq-dot{transition:opacity 96ms ease,transform 96ms ease;transform-origin:center;transform-box:fill-box;will-change:opacity,transform}
#list-left,#list-right{position:absolute;top:409px;height:318px;width:422px;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-y;-ms-overflow-style:none;isolation:isolate}
#list-left::-webkit-scrollbar,#list-right::-webkit-scrollbar{display:none;width:0;height:0}
#list-left{left:323px}#list-right{left:848.5px}
.song{height:64.17px;width:422px;margin:0;display:flex;align-items:flex-start;position:relative;isolation:isolate;background:transparent;color:#eee}
.song:before{content:'';position:absolute;z-index:-1;left:64px;right:1px;top:1px;height:50px;background:linear-gradient(90deg,rgba(18,29,51,.35),rgba(18,29,51,0));border-radius:6px;opacity:0;transition:opacity 240ms ease;pointer-events:none}
.song:hover:before{opacity:.25}
/* Exact Figma Code Layer from the attachment: 46 x 46.17 frame, 41.4 chrome. */
.dial-frame{position:relative;display:grid;place-items:center;width:46px;height:46.17px;flex:0 0 46px;margin:2px 0 0}
.music-control{appearance:none;display:block;width:41.4px;height:41.4px;min-width:0;min-height:0;margin:0;padding:0;border:0;outline:none;background:transparent;border-radius:50%;position:relative;cursor:pointer;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}

.music-control:focus-visible{outline:1px solid #dedede;outline-offset:-2px;border-radius:50%}
.morph-ring{position:absolute;width:44.8%;height:44.8%;left:50%;top:50%;transform:translate(-50%,-50%);overflow:visible;pointer-events:none;filter:drop-shadow(0 1.2px 1.4px rgba(0,0,0,.52)) drop-shadow(0 0 1.5px rgba(213,241,255,.38))}

.copy{display:block;min-width:0;padding-top:3px}

/* Exact original Figma Unbounded heading and Zalando Sans metadata remain in the SVG. */
.song-main,.name,.artist,.duration{font-family:"Zalando Sans",Arial,Helvetica,sans-serif}
/* Subtle audio UI feedback; no layout movement or enlargement of the chrome dial. */
.song{transition:background-color 230ms ease}
.song::before{left:62px;right:3px;top:1px;height:51px;border-radius:7px;
 background:linear-gradient(90deg,rgba(43,62,92,.34),rgba(36,46,63,.12) 75%,transparent);
 transition:opacity 220ms ease,background 220ms ease}
.song:hover::before,.song:focus-within::before{opacity:.88}
.song.is-current::before{opacity:.36}
.song.is-current:hover::before{opacity:.92}
.music-control{transition:filter 230ms ease}
.music-control:hover,.music-control:focus-visible{filter:drop-shadow(0 0 4px rgba(163,207,230,.32))}
.music-control::before{transition:transform 200ms cubic-bezier(.2,.75,.2,1)}
.song-main .name,.song-main .artist,.cover,.duration{transition:color 230ms ease,transform 230ms ease,filter 230ms ease,background-color 230ms ease}
.song:hover .name,.song:focus-within .name{color:#fff}
.song:hover .artist,.song:focus-within .artist{color:#c3c7cf}
.song:hover .cover,.song:focus-within .cover{transform:translateY(-1px);background:#f0f3fb;filter:brightness(1.03)}
.song.is-current .name{color:#f4f8ff}
/* One understated Spotify shortcut adjacent to the original duration label. */
#spotify-cta{position:absolute;left:1230px;top:132px;z-index:6;display:grid;
 place-items:center;width:40px;height:40px;padding:0;border-radius:13px;
 border:1px solid rgba(136,166,153,.16);
 background:linear-gradient(145deg,rgba(40,48,44,.44),rgba(13,20,19,.82));
 box-shadow:0 1px 0 rgba(255,255,255,.04) inset;
 text-decoration:none;cursor:pointer;transition:background-color .25s ease, transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s ease,box-shadow .25s ease}
#spotify-cta svg{display:block;width:14px;height:14px;transition:transform .25s ease,filter .25s ease}
#spotify-cta:hover,#spotify-cta:focus-visible{transform:translateY(-2px);
 border-color:rgba(30,215,96,.55);
 background:linear-gradient(145deg,rgba(39,71,52,.65),rgba(11,31,22,.88));
 box-shadow:0 0 16px rgba(30,215,96,.12),0 1px 0 rgba(255,255,255,.08) inset}
#spotify-cta:hover svg,#spotify-cta:focus-visible svg{transform:scale(1.05);filter:drop-shadow(0 0 4px rgba(255,255,255,.25))}
#spotify-cta:focus-visible{outline:1px solid rgba(255,255,255,.55);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.song,.song::before,.music-control,#spotify-cta,#spotify-cta svg,.song-main .name,.song-main .artist,.song .cover,.duration{transition:none!important}}

function resetEntrance(){opened=false;stage.classList.remove('open');const tape=document.getElementById('tape');tape.style.transition='none';void tape.offsetWidth;tape.style.transition='';}
function replayEntrance(){resetEntrance();requestAnimationFrame(()=>requestAnimationFrame(reveal))}
function renderRows(){
 for(const [element,start] of [[left,0],[right,24]]){
  element.innerHTML=tracks.slice(start,start+24).map((t,n)=>{
   const i=start+n;
   const dial=dialTemplate.replaceAll('__I__',String(i));
   return `<div class="song" data-index="${i}"><span class="dial-frame"><button class="music-control" type="button" data-dial="${i}" aria-label="Play ${esc(t.title)}; drag rim to adjust volume" aria-pressed="false">${dial}</button></span><button class="song-main" type="button" data-play="${i}" aria-label="Play ${esc(t.title)}"><span class="cover" aria-hidden="true"></span><span class="copy"><span class="name">${esc(t.title)}</span><span class="artist">${esc(t.artist)}</span></span><span class="duration">${t.duration}</span></button></div>`;
  }).join('');
 }
 shapes=[...document.querySelectorAll('.music-control')].map((btn,i)=>({btn,path:btn.querySelector('.chrome-shape'),grad:btn.querySelector('linearGradient'),i}));
}
function syncState(){
 stage.classList.toggle('playing',playing);
 for(const d of shapes){const active=d.i===trackIndex;d.btn.parentElement.parentElement.classList.toggle('is-current',active);d.btn.setAttribute('aria-pressed',String(active&&playing));d.btn.setAttribute('aria-label',`${active&&playing?'Pause':'Play'} ${tracks[d.i].title}; drag rim to adjust volume`)}
 document.title=`MKA’s mixtape — ${tracks[trackIndex].title}`;
 const spotify=document.getElementById('spotify-cta');if(spotify){spotify.href='https://open.spotify.com/search/'+encodeURIComponent([tracks[trackIndex].title,tracks[trackIndex].artist].join(' '));spotify.setAttribute('aria-label',`Find ${tracks[trackIndex].title} on Spotify`)}
}
async function initAudio(){
 if(audioCtx){if(audioCtx.state==='suspended')await audioCtx.resume();return}
 const Ctor=window.AudioContext||window.webkitAudioContext;if(!Ctor)return;
 audioCtx=new Ctor();analyser=audioCtx.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.76;
 frequencies=new Uint8Array(analyser.frequencyBinCount);sourceNode=audioCtx.createMediaElementSource(audio);sourceNode.connect(analyser);analyser.connect(audioCtx.destination);await audioCtx.resume();
}
async function setPlaying(next,rewind=false){
 if(shared){if(next&& !shared.hasTrack(trackIndex))return false;return next?shared.play():shared.pause();}
 const ticket=++operation;
 if(next){reveal();try{
  await initAudio();if(ticket!==operation)return false;
  if(!audio.getAttribute('src'))audio.src=demoSrc;
  if(rewind)audio.currentTime=0;
  audio.volume=volume;await audio.play();if(ticket!==operation){audio.pause();return false}
  playing=true;
 }catch(e){playing=false;console.warn('Audio could not start',e)}}
 else{audio.pause();playing=false}
 syncState();return playing;
}
async function selectTrack(index){
 const n=Number(index);if(!Number.isInteger(n)||n<0||n>=tracks.length)return;
 if(shared){if(!shared.hasTrack(n)){showUnavailable(n);return;}trackIndex=n;clearUnavailable();await shared.select(n);return;}
 if(trackIndex===n&&playing){await setPlaying(false);return}
 trackIndex=n;volume=trackVolumes[n];audio.volume=volume;const src=tracks[n].src||demoSrc;
 if(audio.getAttribute('src')!==src){audio.src=src;audio.load()}
 else{try{audio.currentTime=0}catch{}}
 syncState();await setPlaying(true,false);
}
function setSongSource(index,url){if(shared)return false;const t=tracks[index];if(!t)return false;t.src=url||'';if(index===trackIndex){audio.src=t.src||demoSrc;audio.load();if(playing)void setPlaying(true,true)}return true}
function setVolume(next,index=trackIndex){
 const i=Number(index);if(!Number.isInteger(i)||i<0||i>=tracks.length)return;
 const v=clamp(next,0,1);trackVolumes[i]=v;
 if(i===trackIndex){volume=v;if(shared)shared.setVolume(v);else audio.volume=v}
 const dial=shapes[i]?.btn;if(dial)dial.style.setProperty('--knob-angle',`${(v-.62)*245}deg`);
}
function geom(event,btn){const r=btn.getBoundingClientRect();const x=event.clientX-r.left-r.width/2,y=event.clientY-r.top-r.height/2;return {radius:Math.hypot(x,y)/(Math.min(r.width,r.height)/2),angle:Math.atan2(y,x)}}
for(const el of [left,right]){
 el.addEventListener('click',e=>{
  const row=e.target.closest('[data-play]');if(row){void selectTrack(Number(row.dataset.play));return}
  const btn=e.target.closest('[data-dial]');if(!btn)return;
  if(btn.dataset.suppressClick==='1'){btn.dataset.suppressClick='0';return}
  void selectTrack(Number(btn.dataset.dial));
 });
 el.addEventListener('pointerdown',e=>{
  const btn=e.target.closest('[data-dial]');if(!btn||e.button>0)return;
  const p=geom(e,btn);pointer={btn,id:e.pointerId,x:e.clientX,y:e.clientY,lastAngle:p.angle,rim:p.radius>.53,moved:false};
  btn.setPointerCapture(e.pointerId);
 });
 el.addEventListener('pointermove',e=>{
  if(!pointer||pointer.id!==e.pointerId)return;
  if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>2)pointer.moved=true;
  if(!pointer.moved||!pointer.rim)return;
  const p=geom(e,pointer.btn);let diff=p.angle-pointer.lastAngle;
  if(diff>Math.PI)diff-=TAU;if(diff<-Math.PI)diff+=TAU;
  pointer.lastAngle=p.angle;const i=Number(pointer.btn.dataset.dial);setVolume(trackVolumes[i]+diff/(Math.PI*1.5),i);
 });
 el.addEventListener('pointerup',e=>{
  if(!pointer||pointer.id!==e.pointerId)return;
  if(pointer.moved)pointer.btn.dataset.suppressClick='1';pointer=null;
 });
 el.addEventListener('pointercancel',()=>{pointer=null});
 el.addEventListener('wheel',e=>{const btn=e.target.closest('[data-dial]');if(!btn)return;e.preventDefault();setVolume(trackVolumes[Number(btn.dataset.dial)]-Math.sign(e.deltaY)*.045,Number(btn.dataset.dial))},{passive:false});
 el.addEventListener('keydown',e=>{const btn=e.target.closest('[data-dial]');if(!btn)return;
  if(['ArrowUp','ArrowRight'].includes(e.key)){e.preventDefault();setVolume(trackVolumes[Number(btn.dataset.dial)]+.05,Number(btn.dataset.dial))}
  else if(['ArrowDown','ArrowLeft'].includes(e.key)){e.preventDefault();setVolume(trackVolumes[Number(btn.dataset.dial)]-.05,Number(btn.dataset.dial))}
 });
}
audio.addEventListener('ended',()=>{void selectTrack((trackIndex+1)%tracks.length)});
audio.addEventListener('pause',()=>{if(playing){playing=false;syncState()}});
audio.addEventListener('play',()=>{if(!playing){playing=true;syncState()}});
function animate(now){
 const dt=clamp((now-last)/1000,.001,.05);last=now;
 if(playing&&(shared||(analyser&&frequencies))){
  if(shared){if(!frequencies)frequencies=new Uint8Array(512);shared.readFrequencyData(frequencies);}else analyser.getByteFrequencyData(frequencies);
  for(let col=0;col<8;col++){
   const idx=Math.min(frequencies.length-1,Math.round(2+Math.pow(col/7,1.4)*90));
   bins[col]=lerp(bins[col],frequencies[idx]/255,ease(18,dt));
  }
 }else{for(let i=0;i<8;i++)bins[i]*=Math.exp(-8*dt)}
 for(const dot of dots){const col=Number(dot.dataset.col),row=Number(dot.dataset.row);
  const lit=bins[col]*6>5-row+.1;
  dot.style.opacity=(!playing||lit)?'1':'.18';
  dot.style.transform=playing&&lit?'scale(1.1)':'scale(1)';
 }
 let energy=0;for(let i=0;i<8;i++)energy+=bins[i];energy/=8;
 for(const d of shapes){
  const i=d.i,target=(playing&&trackIndex===i)?1:0;
  if(Math.abs(activeFade[i]-target)<.0005){activeFade[i]=target;if(target===0)continue;}
  else activeFade[i]=lerp(activeFade[i],target,ease(target?7.2:8.5,dt));
  if(target)shapeClock[i]+=dt*(1+energy*.11);
  const a=activeFade[i];d.path.setAttribute('d',flowingInfinityPath(a,shapeClock[i]));
  d.path.setAttribute('stroke-width',(15.5-3.5*a).toFixed(2));
  if(target)gradAngle[i]=(gradAngle[i]+dt*(120+energy*75))%360;
  d.grad.setAttribute('gradientTransform',`rotate(${gradAngle[i].toFixed(2)} 50 50)`);
 }
 requestAnimationFrame(animate);
}
function clearUnavailable(){document.getElementById('mka-audio-status')?.remove();}
function showUnavailable(i){clearUnavailable();const el=document.createElement('div');el.id='mka-audio-status';el.setAttribute('role','status');Object.assign(el.style,{position:'absolute',bottom:'18px',left:'50%',transform:'translateX(-50%)',zIndex:'999',maxWidth:'90%',background:'#151515',color:'#fff',padding:'10px 16px',border:'1px solid #555',borderRadius:'6px',fontSize:'13px',textAlign:'center'});el.textContent=tracks[i].title+': no recording supplied. ';const a=document.createElement('a');a.href='https://open.spotify.com/search/'+encodeURIComponent(tracks[i].title);a.target='_blank';a.rel='noopener noreferrer';a.style.color='#b6e6c5';a.textContent='Search Spotify';el.append(a);stage.append(el);setTimeout(()=>el.remove(),5500);}
renderRows();if(shared){const unsubscribe=shared.subscribe(s=>{playing=s.playing;trackIndex=s.trackIndex;volume=s.volume;trackVolumes[0]=s.volume;const dial=shapes[0]?.btn;if(dial)dial.style.setProperty('--knob-angle',`${(s.volume-.62)*245}deg`);syncState();});addEventListener('pagehide',unsubscribe,{once:true});for(const b of document.querySelectorAll('[data-dial],[data-play]')){const i=Number(b.dataset.dial??b.dataset.play);if(i>0)b.title='No recording supplied — select to view availability';}}else setVolume(volume);syncState();requestAnimationFrame(animate);
if(window.parent===window)setTimeout(reveal,220);
window.MKAMixtape={open:reveal,resetEntrance,replayEntrance,select:selectTrack,play:()=>setPlaying(true),pause:()=>setPlaying(false),toggle:()=>setPlaying(!playing),setSongSource,getState:()=>({opened,playing,trackIndex,track:tracks[trackIndex],volume,trackVolumes:Array.from(trackVolumes)})};
addEventListener('mka:open',reveal);addEventListener('mka:replay',replayEntrance);
addEventListener('mka:select',e=>{if(typeof e.detail?.index==='number')void selectTrack(e.detail.index)});
})();</script><script>addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='mka:runtime')return;if(e.data.action==='open')window.MKAMixtape?.open();if(e.data.action==='reset')window.MKAMixtape?.resetEntrance();});</script></body></html>
