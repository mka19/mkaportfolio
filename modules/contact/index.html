<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111112">
  <meta name="description" content="Four illustrated contact shortcuts that come alive on hover.">
  <title>Khaif — Contact in Motion</title>
  <style>
    :root { color-scheme: normal; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; }
    html, body { background: transparent; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, Helvetica, sans-serif; }
    .component {
      position: relative; width: min(460px, calc(100vw - 24px)); aspect-ratio: 460 / 121;
      flex: none; isolation: isolate; user-select: none;
    }
    .original { position: absolute; inset: 0; display: block; width: 100%; height: 100%; pointer-events: none; }
    .contact-card { display:block; text-decoration:none;
      position: absolute; top: 11.302645%; width: 20.434783%; aspect-ratio: 1 / 1;
      padding: 0; margin: 0; border: 0; appearance: none; background: none;
      border-radius: 8.5%; overflow: hidden; cursor: pointer; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .contact-card:nth-of-type(1) { left: 2.968%; }
    .contact-card:nth-of-type(2) { left: 27.533%; }
    .contact-card:nth-of-type(3) { left: 52.098%; }
    .contact-card:nth-of-type(4) { left: 76.663%; }
    .contact-card:focus-visible { outline: 2px solid #dcfaff; outline-offset: 3px; overflow: visible; }
    .scene {
      position: absolute; inset: 0; opacity: 0; visibility: hidden;
      transform: scale(.965); transition: opacity 190ms ease, transform 310ms cubic-bezier(.2,.82,.2,1), visibility 0s linear 310ms;
      overflow: hidden; border-radius: inherit;
    }
    .contact-card:is(:hover,:focus-visible,.host-hover) .scene {
      opacity: 1; visibility: visible; transform: scale(1);
      transition: opacity 150ms ease, transform 390ms cubic-bezier(.12,.9,.14,1.08), visibility 0s;
    }
    .art { position: absolute; pointer-events: none; height: auto; display: block; user-select: none; -webkit-user-drag: none; }
    .backdrop { inset: 0; width: 100%; height: 100%; object-fit: fill; }
    .scene > :not(.backdrop) { will-change: transform; }

    /* LinkedIn: the two illustrated fists meet, then the lightning punctuates contact. */
    .fist-top { width: 57%; left: 21.5%; top: -3%; }
    .fist-bottom { width: 61%; left: 19.5%; bottom: 0; }
    .fist-sparks { width: 80%; left: 10%; top: 39%; opacity: 0; transform-origin: 50% 36%; }
    .contact-card:is(:hover,:focus-visible,.host-hover) .fist-top { animation: bump-top 920ms cubic-bezier(.25,.79,.28,1) both; }
    .contact-card:is(:hover,:focus-visible,.host-hover) .fist-bottom { animation: bump-bottom 920ms cubic-bezier(.25,.79,.28,1) both; }
    .contact-card:is(:hover,:focus-visible,.host-hover) .fist-sparks { animation: bump-sparks 920ms ease-out both; }

    /* Instagram: the top finger presses the shutter and the lens flashes. */
    .camera { width: 68%; left: 16%; bottom: -6%; transform-origin: 50% 37%; }
    .lens-flash { position: absolute; width: 40%; height: 40%; left: 27%; top: 23%; opacity: 0; transform: scale(.25); }
    .lens-flash svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 3px rgba(255,255,255,.75)); }
    .contact-card:is(:hover,:focus-visible,.host-hover) .camera { animation: camera-come-in 680ms cubic-bezier(.2,.8,.2,1.1) both, camera-tap 2.05s ease-in-out 680ms infinite; }
    .contact-card:is(:hover,:focus-visible,.host-hover) .lens-flash { animation: camera-flash 2.05s ease-out 680ms infinite; }

    /* Email: the hand pulls the cream envelope down out of the red mailbox. */
    .mailbox { width: 75%; left: 13%; bottom: -17%; }
    .contact-card:is(:hover,:focus-visible,.host-hover) .mailbox { animation: mailbox-rise 720ms cubic-bezier(.18,.9,.26,1) both, mail-extract 2.4s ease-in-out 720ms infinite; }

    /* WhatsApp: phone and the supporting hand move together as one object. */
    .phone-rig { position: absolute; inset: 0; transform-origin: 52% 74%; }
    .phone { width: 47%; left: 26.5%; top: 8%; z-index: 2; }
    .phone-hand { width: 70%; left: 15%; bottom: -18%; z-index: 1; }
    .contact-card:is(:hover,:focus-visible,.host-hover) .phone-rig { animation: phone-reveal 550ms cubic-bezier(.2,.8,.2,1.16) both, shake-phone 2.35s ease-in-out 580ms infinite; }

    @keyframes bump-top {
      0% { transform: translateY(-16%); }
      42% { transform: translateY(4%); }
      59% { transform: translateY(-2%); }
      74%,100% { transform: translateY(0); }
    }
    @keyframes bump-bottom {
      0% { transform: translateY(20%); }
      42% { transform: translateY(-5%); }
      61% { transform: translateY(2%); }
      74%,100% { transform: translateY(0); }
    }
    @keyframes bump-sparks {
      0%,34% { opacity: 0; transform: scale(.48); }
      43% { opacity: 1; transform: scale(1.17); }
      56%,76% { opacity: 1; transform: scale(1); }
      100% { opacity: .84; transform: scale(.96); }
    }
    @keyframes camera-come-in {
      0% { transform: translateY(19%); }
      70% { transform: translateY(-2%); }
      100% { transform: translateY(0); }
    }
    @keyframes camera-tap {
      0%,21%,35%,100% { transform: translateY(0) scale(1); }
      27% { transform: translateY(1.5%) scale(.975); }
      31% { transform: translateY(.6%) scale(.993); }
    }
    @keyframes camera-flash {
      0%,21%,34%,100% { opacity: 0; transform: scale(.3) rotate(-18deg); }
      25% { opacity: .98; transform: scale(1.16) rotate(0deg); }
      29% { opacity: 1; transform: scale(.8) rotate(13deg); }
      32% { opacity: 0; transform: scale(1.38) rotate(20deg); }
    }
    @keyframes mailbox-rise {
      0% { transform: translateY(18%); }
      68% { transform: translateY(-2%); }
      100% { transform: translateY(0); }
    }
    @keyframes mail-extract {
      0%,16%,100% { transform: translateY(0); }
      34% { transform: translateY(-2%); }
      54%,66% { transform: translateY(5%); }
      82% { transform: translateY(0); }
    }
    @keyframes phone-reveal {
      0% { transform: translateY(20%) scale(.95); }
      72% { transform: translateY(-2%) scale(1.01); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes shake-phone {
      0%,15%,55%,100% { transform: rotate(0deg) translateX(0); }
      19% { transform: rotate(-4deg) translateX(-1.5%); }
      24% { transform: rotate(4.4deg) translateX(1.3%); }
      29% { transform: rotate(-3.3deg) translateX(-1%); }
      34% { transform: rotate(2.6deg) translateX(.7%); }
      40% { transform: rotate(-1.6deg); }
      46% { transform: rotate(.8deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .scene { transition: none !important; }
      .contact-card * { animation: none !important; }
      .contact-card:is(:hover,:focus-visible,.host-hover) .lens-flash { opacity: .75; transform: scale(.9); }
    }
  
.component{width:100%;max-width:460px;}
</style>
<style id="mka-fit-panel-v11">:root{color-scheme:dark}html,body{width:100%;height:100%;min-height:0;overflow:hidden!important;scrollbar-width:none!important;background:transparent!important}*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}.component{width:100%;height:100%;max-width:none;aspect-ratio:auto;overflow:hidden}.contact-card{aspect-ratio:auto;height:77.68595%}</style>
</head>
<body>
  <main class="component" aria-label="Four interactive contact cards: LinkedIn, Instagram, Email, WhatsApp">
    <!-- The supplied Figma vector is preserved in full at the exact 460 × 121 size. -->
    <img class="original" src="assets/frame-70.svg" alt="" aria-hidden="true">

    <a class="contact-card" data-contact="linkedin" href="https://www.linkedin.com/in/mkhaifa19/" target="_blank" rel="noopener noreferrer" aria-label="Open LinkedIn profile" title="LinkedIn">
      <span class="scene">
        <img class="art backdrop" src="assets/blue.png" alt="">
        <img class="art fist-top" src="assets/fist-top.png" alt="">
        <img class="art fist-bottom" src="assets/fist-bottom.png" alt="">
        <img class="art fist-sparks" src="assets/sparks.png" alt="">
      </span>
    </a>

    <a class="contact-card" data-contact="instagram" href="https://www.instagram.com/khaifanikii/" target="_blank" rel="noopener noreferrer" aria-label="Open Instagram profile" title="Instagram">
      <span class="scene">
        <img class="art backdrop" src="assets/red.png" alt="">
        <img class="art camera" src="assets/camera.png" alt="">
        <span class="lens-flash" aria-hidden="true">
          <svg viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M25 2L28.8 19.3L46 25L28.8 29L25 48L20.3 29L4 25L20.3 20.4L25 2Z" fill="#FFF2A6" stroke="#0530D3" stroke-width="1.5"/>
            <circle cx="25" cy="25" r="8" fill="#FFFFFF" fill-opacity=".85"/>
          </svg>
        </span>
      </span>
    </a>

    <a class="contact-card" data-contact="email" href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=khaifaman73@gmail.com" target="_blank" rel="noopener noreferrer" aria-label="Compose email in Gmail" title="Email">
      <span class="scene">
        <img class="art backdrop" src="assets/pink.png" alt="">
        <img class="art mailbox" src="assets/mailbox.png" alt="">
      </span>
    </a>

    <a class="contact-card" data-contact="whatsapp" href="https://wa.me/917349322276" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp" title="Open WhatsApp">
      <span class="scene">
        <img class="art backdrop" src="assets/green.png" alt="">
        <span class="phone-rig">
          <img class="art phone" src="assets/phone.png" alt="">
          <img class="art phone-hand" src="assets/phone-hand.png" alt="">
        </span>
      </span>
    </a>
  </main>

<script>
// The original artwork and keyframes are untouched. Only visual hover is bridged.
if(window.parent!==window){
 const cards=[...document.querySelectorAll('.contact-card')];
 for(const card of cards)card.tabIndex=-1;
 window.addEventListener('message',event=>{
  if(event.source!==window.parent||(event.origin!==location.origin&&!(location.protocol==='file:'&&event.origin==='null'))||event.data?.type!=='mka:contact-hover'||typeof event.data.active!=='boolean')return;
  const card=cards.find(el=>el.dataset.contact===event.data.name);
  if(card)card.classList.toggle('host-hover',event.data.active);
 });
}
</script>
</body>
</html>
