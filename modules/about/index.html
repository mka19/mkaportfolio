&lt;body&gt;
  &lt;!--

  &lt;div class=&quot;why-me-bloom&quot; data-trigger=&quot;hover&quot; role=&quot;button&quot; tabindex=&quot;0&quot;
       aria-label=&quot;Animate the radial flower&quot; aria-pressed=&quot;false&quot;&gt;
    &lt;svg viewBox=&quot;0 0 520 520&quot; aria-hidden=&quot;true&quot; focusable=&quot;false&quot;&gt;
      &lt;defs id=&quot;bloom-gradients&quot;&gt;&lt;/defs&gt;

      &lt;g id=&quot;white-fills&quot;&gt;&lt;/g&gt;
      &lt;g id=&quot;process-steps&quot;&gt;&lt;/g&gt;
      &lt;text id=&quot;process-percent&quot; x=&quot;260&quot; y=&quot;266&quot; dominant-baseline=&quot;middle&quot; text-anchor=&quot;middle&quot; fill=&quot;#ffffff&quot; font-family=&quot;Unbounded, Zalando Sans, Arial, sans-serif&quot; font-size=&quot;18&quot; font-weight=&quot;500&quot;&gt;0%&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      &quot;use strict&quot;;

      // All visual and motion controls are here, separately from layout CSS.
      const SETTINGS = {
        center: 260,
        segmentCount: 8,
        outerRadius: 177,
        innerRadius: 38,
        segmentGapDegrees: 0.75,
        outerCornerDegrees: 3.8,
        innerCornerDegrees: 10,
        initialWhiteRadii: [112, 157, 158, 99, 161, 110, 77, 118],
        fillDurationMs: 1533,
        reverseDurationMs: 1200,
        rotationMsPerTurn: 9744,
        rotationStartDelayMs: 280,
        rotationRampMs: 867,
        gradientPetalWidth: 78,
        gradientPetalLength: 76,
        petalCenterAtRest: 151,
        petalCenterAtBloom: 154,
        backgroundGrey: &quot;#646263&quot;,
        whiteTones: [
          &quot;#EEE9E9&quot;, &quot;#F3F0F1&quot;, &quot;#E9E7EF&quot;, &quot;#E5E2EB&quot;,
          &quot;#EEEAF2&quot;, &quot;#DFDDE8&quot;, &quot;#F1EDF0&quot;, &quot;#ECE8E9&quot;
        ],
        // Nine soft gradient treatments from the supplied palette reference.
        // Eight are shown at once; change petalPaletteOrder to swap any in.
        petalPaletteOrder: [0, 1, 2, 5, 8, 7, 6, 3],
        gradients: [
          { colors: [&quot;#000000&quot;, &quot;#001230&quot;, &quot;#155A7D&quot;, &quot;#4D9CA1&quot;, &quot;#B4E002&quot;], glow: &quot;#C7EB08&quot;, x: &quot;83%&quot;, y: &quot;42%&quot; },
          { colors: [&quot;#071A05&quot;, &quot;#063101&quot;, &quot;#51A601&quot;, &quot;#A1CA49&quot;, &quot;#BFD887&quot;], glow: &quot;#D6F58A&quot;, x: &quot;75%&quot;, y: &quot;48%&quot; },
          { colors: [&quot;#CBD1DD&quot;, &quot;#A4B1C2&quot;, &quot;#828FB8&quot;, &quot;#4953A1&quot;, &quot;#4248A0&quot;], glow: &quot;#F0F1F5&quot;, x: &quot;30%&quot;, y: &quot;32%&quot; },
          { colors: [&quot;#BCE300&quot;, &quot;#8BCF00&quot;, &quot;#6FBB52&quot;, &quot;#7F259B&quot;, &quot;#440154&quot;], glow: &quot;#CBE900&quot;, x: &quot;32%&quot;, y: &quot;49%&quot; },
          { colors: [&quot;#575757&quot;, &quot;#878787&quot;, &quot;#A2A2A2&quot;, &quot;#BEBEBE&quot;, &quot;#D3D3D3&quot;], glow: &quot;#FFFFFF&quot;, x: &quot;28%&quot;, y: &quot;22%&quot; },
          { colors: [&quot;#A7915A&quot;, &quot;#97824D&quot;, &quot;#AA9E67&quot;, &quot;#BFBB95&quot;, &quot;#D0CDBA&quot;], glow: &quot;#EEE4C3&quot;, x: &quot;65%&quot;, y: &quot;40%&quot; },
          { colors: [&quot;#042625&quot;, &quot;#021F1D&quot;, &quot;#012F15&quot;, &quot;#25B37C&quot;, &quot;#7AD3A9&quot;], glow: &quot;#21E6AB&quot;, x: &quot;68%&quot;, y: &quot;48%&quot; },
          { colors: [&quot;#E0B185&quot;, &quot;#D39F70&quot;, &quot;#CD9D77&quot;, &quot;#9A8B93&quot;, &quot;#2D3342&quot;], glow: &quot;#F4C49A&quot;, x: &quot;27%&quot;, y: &quot;51%&quot; },
          { colors: [&quot;#45000B&quot;, &quot;#8A000B&quot;, &quot;#B70002&quot;, &quot;#E6B38F&quot;, &quot;#EADDB4&quot;], glow: &quot;#FF7039&quot;, x: &quot;35%&quot;, y: &quot;34%&quot; }
        ]
      };

      const root = document.querySelector(&quot;.why-me-bloom&quot;);
      const defs = root.querySelector(&quot;#bloom-gradients&quot;);
      const rotator = root.querySelector(&quot;#gradient-rotator&quot;);
      const greyLayer = root.querySelector(&quot;#grey-segments&quot;);
      const seamlessBacking = root.querySelector(&quot;#seamless-backing&quot;);
      const whiteLayer = root.querySelector(&quot;#white-fills&quot;);
      const SVG_NS = &quot;http://www.w3.org/2000/svg&quot;;
      const reducedMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
      const mode = root.dataset.trigger || &quot;both&quot;;
      const cx = SETTINGS.center;
      const cy = SETTINGS.center;
      const angleStep = 360 / SETTINGS.segmentCount;
      const uid = `bloom-${Math.random().toString(36).slice(2, 9)}`;
      const whitePaths = [];
      const colorPetals = [];
      const processPercent = root.querySelector(&quot;#process-percent&quot;);
      const processSteps = [&quot;RESEARCH&quot;, &quot;AI&quot;, &quot;WIREFRAME&quot;, &quot;DESIGN&quot;, &quot;ITERATE&quot;];
      const processStepLayer = root.querySelector(&quot;#process-steps&quot;);
      const processStepNodes = [];

      const svgElement = (name, attrs = {}) =&gt; {
        const el = document.createElementNS(SVG_NS, name);
        for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
        return el;
      };

      const polar = (radius, degrees) =&gt; {
        const a = degrees * Math.PI / 180;
        return [cx + radius * Math.cos(a), cy + radius * Math.sin(a)];
      };

      const xy = (point) =&gt; point.map(n =&gt; n.toFixed(3)).join(&quot; &quot;);
      const clamp01 = (n) =&gt; Math.min(1, Math.max(0, n));
      const mix = (a, b, t) =&gt; a + (b - a) * t;
      const ease = (t) =&gt; {
        t = clamp01(t);
        // Gentle smoothstep; no abrupt acceleration or snapping at the ends.
        return t * t * (3 - 2 * t);
      };

      processSteps.forEach((label, index) =&gt; {
        const angle = -90 + index * (360 / processSteps.length);
        const [x, y] = polar(105, angle);
        const labelAngle = angle &gt; 90 || angle &lt; -90 ? angle + 180 : angle;
        const node = svgElement(&quot;text&quot;, {
          x: x.toFixed(2), y: y.toFixed(2),
          transform: `rotate(${labelAngle.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)})`,
          &quot;text-anchor&quot;: &quot;middle&quot;, &quot;dominant-baseline&quot;: &quot;middle&quot;,
          fill: &quot;#302a34&quot;, &quot;font-family&quot;: &quot;Unbounded, Zalando Sans, Arial, sans-serif&quot;,
          &quot;font-size&quot;: &quot;13&quot;, &quot;font-weight&quot;: &quot;500&quot;, &quot;letter-spacing&quot;: &quot;.1&quot;,
          opacity: &quot;0&quot;
        });
        node.textContent = label;
        processStepLayer.appendChild(node);
        processStepNodes.push(node);
      });

      // Cut the central chart out of the rotating gradient layer. This keeps
      // the petal gaps and centre genuinely transparent on any page background.
      const outsideMaskId = `${uid}-outside-chart`;
      const outsideMask = svgElement(&quot;mask&quot;, {
        id: outsideMaskId,
        maskUnits: &quot;userSpaceOnUse&quot;,
        x: 0, y: 0, width: 520, height: 520
      });
      outsideMask.appendChild(svgElement(&quot;rect&quot;, {
        x: 0, y: 0, width: 520, height: 520, fill: &quot;#FFFFFF&quot;
      }));
      outsideMask.appendChild(svgElement(&quot;circle&quot;, {
        // Slight overlap prevents an antialiased dark rim around the flowers.
        cx, cy, r: SETTINGS.outerRadius - 1.8, fill: &quot;#000000&quot;
      }));
      defs.appendChild(outsideMask);
      rotator.setAttribute(&quot;mask&quot;, `url(#${outsideMaskId})`);

      // Annular sector with smoothly rounded inner AND outer corners.
      // White sector paths use this same geometry with a changing outer radius.
      function roundedWedge(index, outerR, gapDegrees = SETTINGS.segmentGapDegrees,
                            cornerDegrees = SETTINGS.outerCornerDegrees,
                            innerCornerDegrees = SETTINGS.innerCornerDegrees) {
        const start = -90 + angleStep * index + gapDegrees;
        const end = -90 + angleStep * (index + 1) - gapDegrees;
        const innerR = SETTINGS.innerRadius;
        const outerTrim = Math.min(12, (outerR - innerR) * 0.20);
        const innerTrim = 12;
        const a = cornerDegrees;
        const b = innerCornerDegrees;

        return [
          `M ${xy(polar(innerR + innerTrim, start))}`,
          `L ${xy(polar(outerR - outerTrim, start))}`,
          `Q ${xy(polar(outerR, start))} ${xy(polar(outerR, start + a))}`,
          `A ${outerR.toFixed(3)} ${outerR.toFixed(3)} 0 0 1 ${xy(polar(outerR, end - a))}`,
          `Q ${xy(polar(outerR, end))} ${xy(polar(outerR - outerTrim, end))}`,
          `L ${xy(polar(innerR + innerTrim, end))}`,
          `Q ${xy(polar(innerR, end))} ${xy(polar(innerR, end - b))}`,
          `A ${innerR} ${innerR} 0 0 0 ${xy(polar(innerR, start + b))}`,
          `Q ${xy(polar(innerR, start))} ${xy(polar(innerR + innerTrim, start))}`,
          &quot;Z&quot;
        ].join(&quot; &quot;);
      }

      // At full bloom this subtle, solid backing sits underneath the wedges.
      // It eliminates black hairline artifacts; the central hole is still clear.
      const ringPath = [
        `M ${cx + SETTINGS.outerRadius} ${cy}`,
        `A ${SETTINGS.outerRadius} ${SETTINGS.outerRadius} 0 1 0 ${cx - SETTINGS.outerRadius} ${cy}`,
        `A ${SETTINGS.outerRadius} ${SETTINGS.outerRadius} 0 1 0 ${cx + SETTINGS.outerRadius} ${cy}`,
        `M ${cx + SETTINGS.innerRadius} ${cy}`,
        `A ${SETTINGS.innerRadius} ${SETTINGS.innerRadius} 0 1 0 ${cx - SETTINGS.innerRadius} ${cy}`,
        `A ${SETTINGS.innerRadius} ${SETTINGS.innerRadius} 0 1 0 ${cx + SETTINGS.innerRadius} ${cy}`,
        &quot;Z&quot;
      ].join(&quot; &quot;);
      seamlessBacking.setAttribute(&quot;d&quot;, ringPath);

      SETTINGS.petalPaletteOrder.forEach((paletteIndex, i) =&gt; {
        const palette = SETTINGS.gradients[paletteIndex];
        const id = `${uid}-gradient-${i}`;
        const grad = svgElement(&quot;linearGradient&quot;, {
          // Horizontal blending keeps all palette hues visible on the short
          // rounded cap that extends beyond the white radial diagram.
          id, x1: &quot;0%&quot;, y1: &quot;36%&quot;, x2: &quot;100%&quot;, y2: &quot;64%&quot;
        });
        palette.colors.forEach((color, j) =&gt; {
          grad.appendChild(svgElement(&quot;stop&quot;, {
            offset: `${j * 100 / (palette.colors.length - 1)}%`,
            &quot;stop-color&quot;: color
          }));
        });
        defs.appendChild(grad);

        // A transparent diffuse highlight inside the flat silhouette adds
        // the palette reference&#x27;s soft colour bloom without a 3D sphere.
        const glowId = `${uid}-glow-${i}`;
        const glow = svgElement(&quot;radialGradient&quot;, {
          id: glowId, cx: palette.x, cy: &quot;30%&quot;, r: &quot;69%&quot;
        });
        [[&quot;0%&quot;, &quot;0.76&quot;], [&quot;36%&quot;, &quot;0.38&quot;], [&quot;75%&quot;, &quot;0.09&quot;], [&quot;100%&quot;, &quot;0&quot;]].forEach(([offset, opacity]) =&gt; {
          glow.appendChild(svgElement(&quot;stop&quot;, {
            offset, &quot;stop-color&quot;: palette.glow, &quot;stop-opacity&quot;: opacity
          }));
        });
        defs.appendChild(glow);

        const volume = svgElement(&quot;radialGradient&quot;, {

        });
        [[&quot;0%&quot;, &quot;#FFFFFF&quot;, &quot;0.08&quot;], [&quot;58%&quot;, &quot;#000000&quot;, &quot;0&quot;], [&quot;100%&quot;, &quot;#000000&quot;, &quot;0.16&quot;]].forEach(([offset, color, opacity]) =&gt; {
          volume.appendChild(svgElement(&quot;stop&quot;, {
            offset, &quot;stop-color&quot;: color, &quot;stop-opacity&quot;: opacity
          }));
        });
        defs.appendChild(volume);
        group.appendChild(svgElement(&quot;ellipse&quot;, {
          cx: 0, cy: 0,
          rx: SETTINGS.gradientPetalWidth,
          ry: SETTINGS.gradientPetalLength,
          fill: `url(#${volumeId})`
        }));
        rotator.appendChild(group);
        colorPetals.push(group);
      });

      for (let i = 0; i &lt; SETTINGS.segmentCount; i++) {
        greyLayer.appendChild(svgElement(&quot;path&quot;, {
          d: roundedWedge(i, SETTINGS.outerRadius),
          fill: SETTINGS.backgroundGrey
        }));
        const white = svgElement(&quot;path&quot;, {
          d: roundedWedge(i, SETTINGS.initialWhiteRadii[i]),
          fill: SETTINGS.whiteTones[i]

      let progress = 0;
      let target = 0;
      let tween = null;
      let rotation = 0;
      let spinStartedAt = null;
      let lastTime = 0;
      let isPinned = false;

        const percent = Math.round(clamp01(progress) * 100);

      function updateFromInput() {
        startTween(isPinned || (hoverAllowed() &amp;&amp; isHovered));
      }

      root.addEventListener(&quot;pointerenter&quot;, (event) =&gt; {
        if (!bloomEnabled || (event.pointerType !== &quot;mouse&quot; &amp;&amp; event.pointerType !== &quot;pen&quot;)) return;
        isHovered = true;

      });
      root.addEventListener(&#x27;pointermove&#x27;,event=&gt;{

        isHovered=true;updateFromInput();
      });

      });
      root.addEventListener(&quot;pointerleave&quot;, () =&gt; {
        isHovered = false;
        updateFromInput();
      });
      root.addEventListener(&quot;click&quot;, (event) =&gt; {
        // Tap always toggles. Desktop click locks/unlocks the bloom.
        if (mode === &quot;hover&quot; &amp;&amp; event.detail !== 0 &amp;&amp; event.pointerType === &quot;mouse&quot;) return;
        isPinned = !isPinned;
        updateFromInput();
      });
      root.addEventListener(&quot;keydown&quot;, (event) =&gt; {
        if (event.key === &quot;Enter&quot; || event.key === &quot; &quot;) {
          event.preventDefault();
          isPinned = !isPinned;
          updateFromInput();
        } else if (event.key === &quot;Escape&quot;) {
          isPinned = false;
          isHovered = false;
          updateFromInput();
        }
      });
      root.addEventListener(&quot;focus&quot;, () =&gt; {
        if (hoverAllowed()) startTween(true);
      });
      root.addEventListener(&quot;blur&quot;, () =&gt; {
        if (!isPinned) updateFromInput();
      });
      reducedMotion.addEventListener(&quot;change&quot;, () =&gt; {
        if (reducedMotion.matches) {
          if (requestId) cancelAnimationFrame(requestId);
          requestId = 0;
          progress = target;
          tween = null;
          draw();
        } else if (target === 1) {
          requestFrame();
        }
      });

      draw();
    })();

function titleMarkup(value, chapter=-1){
 if(chapter===0 && value==='Finding Problems.') return `<h2 class="original-me" aria-label="Finding Problems.">${ORIGINAL_ME_HEADING}</h2>`;
 const split=value.indexOf(' '), first=split<0?value:value.slice(0,split), rest=split<0?'':value.slice(split);
 const safe=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
 return `<h2><span class="heading-first">${safe(first)}</span>${safe(rest)}</h2>`;
}
function fitHeading(root){
 for(const h of root.querySelectorAll('h2:not(.original-me)')){
  h.style.fontSize='36px'; const available=446; const w=h.scrollWidth;
  if(w>available) h.style.fontSize=(36*available/w).toFixed(2)+'px';
 }
}

const plates=chapters.map((s,i)=>{
  const title=document.createElement('div');title.className='title-plate';title.dataset.chapter=i;title.innerHTML=titleMarkup(s.title,i);titleSlot.append(title);
  const body=document.createElement('div');body.className='body-plate';body.dataset.chapter=i;body.innerHTML=`<p class="emphasis">${s.lead}</p><p>${s.body}</p>`;bodySlot.append(body);

const hobbyDetails=[
 ['Designing Half My Life.','A suspicious amount of my life goes into work — happily.','I am genuinely passionate about design, learning and making each idea better than the last.'],
 ['Future DJ, Current Singer.','I want to learn DJing properly one day.','For now, I sing, chase good sounds and spend far too long curating playlists.'],
 ['Always Game.','I am a very sporty person and have tried nearly everything.','Give me a ball, a bat or a little competition and I am probably joining in.'],
 ['Cosmic Curiosity.','I love learning about the cosmos.','Planets, stars and the scale of it all keep reminding me how much there is still to discover.'],
 ['Formula One Brain.','F1 has my full attention.','The speed is exciting, but the strategy, engineering and tiny decisions are what keep me watching.'],
 ['The Long Way Home.','I love driving, especially when there is no rush.','Long rides, new roads and unfamiliar places are my favourite kind of reset.'],
 ['Cooking by Instinct.','I love cooking and trying things without overthinking them.','Sometimes it becomes a proper meal; sometimes it becomes useful research.'],
 ['Made by Hand.','Crafting lets me think differently.','I have made plenty of clay pieces and still love turning a rough idea into something real.'],

<script id="install-hobbies-shadow">
(() => {
 const mount = document.getElementById('hobby-mount');
 const template = document.getElementById('hobbies-shadow-template');
 if (!mount || !template) return;
 const shadow = mount.attachShadow({mode:'open'});
 shadow.append(template.content.cloneNode(true));
 const tiles = [...shadow.querySelectorAll('#hobby-grid > .tile')];
 function select(index) {
   const story = window.__MK_TEST__;
   if (!story || story.get().chapter !== 2) return;
   story.hobby(index);
 }
 tiles.forEach((tile,index) => {
   tile.addEventListener('pointerenter', () => select(index));
   tile.addEventListener('pointerleave', () => select(-1));
   tile.addEventListener('focus', () => select(index));
   tile.addEventListener('blur', () => select(-1));
 });
})();
</script>
