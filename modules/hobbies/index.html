<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khaif — Hobbies in Motion</title>
  <style>
    :root { --tile-size: 152.71px; }
    * { box-sizing: border-box; }
    html, body { background: transparent; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f7f2ed; font: 13px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
    .page { position:relative; padding: 38px 20px 26px; width: max-content; max-width: 100%; }
    .grid { display:grid; grid-template-columns:repeat(3,var(--tile-size)); gap:32px; }
    .tile { width:var(--tile-size); aspect-ratio:1; position:relative; isolation:isolate; overflow:hidden; border-radius:12px; cursor:pointer; }
    .tile:focus-visible {outline:2px solid #f7e6a2; outline-offset:3px;}
    .asset { position:absolute; display:block; height:auto; user-select:none; pointer-events:none; -webkit-user-drag:none; }
    .backdrop { inset:0; width:100%; height:100%; object-fit:fill; }
    .tile > :not(.backdrop) { will-change:transform; }
    .laptop { left:7%; top:9%; width:86%; }
    .typing { left:10%; top:50%; width:80%; }
    .typing.left { clip-path:inset(0 49% 0 0); animation:typing-left 1.25s ease-in-out infinite; }
    .typing.right { clip-path:inset(0 0 0 49%); animation:typing-right 1.12s ease-in-out infinite -.25s; }
    .dj-deck { left:4%; top:16%; width:92%; }
    .dj-deck.disc-left { clip-path:circle(15.5% at 24.1% 39%); transform-origin:24.1% 39%; animation:spin 2.9s linear infinite; }
    .dj-deck.disc-right { clip-path:circle(15.5% at 75.4% 39%); transform-origin:75.4% 39%; animation:dj-scratch 1.95s cubic-bezier(.42,0,.58,1) infinite; }
    .dj-hand { left:35%; top:30.5%; width:47%; transform-origin:48% 92%; animation:dj-hand 1.95s ease-in-out infinite; }
    .sports-hand { left:29%; top:33%; width:48%; transform-origin:48% 96%; animation:balance 2.6s ease-in-out infinite; }
    .ball { left:27%; top:4%; width:47%; aspect-ratio:1; opacity:0; animation:ball-swap 12.5s linear infinite; }
    .ball img { width:100%; height:100%; object-fit:contain; animation:ball-spin 1.6s linear infinite; }
    .ball.b1 { opacity:1; animation-delay:0s; }
    .ball.b2 { animation-delay:-10s; }
    .ball.b3 { animation-delay:-7.5s; }
    .ball.b4 { animation-delay:-5s; }
    .ball.b5 { animation-delay:-2.5s; }
    .telescope { left:20%; top:28%; width:57%; transform-origin:52% 100%; animation:tilt-scope 4.2s ease-in-out infinite; }
    .space-stars { left:4%; top:4%; width:38%; animation:star-twinkle 3.2s ease-in-out infinite; }
    .planet { left:17%; top:7%; width:31%; animation:planet-float 5.6s ease-in-out infinite; }
    .asteroid { right:8%; top:9%; width:20%; animation:planet-float 4.4s ease-in-out infinite -1.5s; }
    .star-a { left:72%; top:5%; width:10%; animation:star-twinkle 2.2s ease-in-out infinite -.8s; }
    .star-b { left:54%; top:19%; width:8%; animation:star-twinkle 2.7s ease-in-out infinite -1.2s; }
    /* Two identical sets form an exact-width, fully opaque, right-moving ticker. */
    .race-window { position:absolute; inset:0; overflow:hidden; container-type:inline-size; }
    .race-track { position:absolute; left:0; top:55%; display:flex; width:max-content; transform:translateX(-50%); animation:race-ticker 8s linear infinite; }
    .race-set { display:flex; flex:none; align-items:center; gap:3.5cqw; padding-right:3.5cqw; }
    .race-set img { display:block; flex:none; width:48cqw; height:auto; user-select:none; pointer-events:none; -webkit-user-drag:none; }
    .steer-road { left:0; top:0; width:100%; }
    .steer-hub { position:absolute; inset:0; transform-origin:50% 63%; animation:steering 3.5s ease-in-out infinite; }
    .wheel { left:21%; top:27%; width:59%; }
    .steer-hands { left:3%; top:49%; width:94%; }
    .steer-hands.steer-left { clip-path:inset(0 50% 0 0); transform:translateX(13%); }
    .steer-hands.steer-right { clip-path:inset(0 0 0 50%); transform:translateX(-13%); }
    .pan { left:29%; top:23%; width:51%; transform-origin:40% 94%; animation:pan-flip 2.75s ease-in-out infinite; }
    .egg { left:38%; top:32%; width:28%; animation:egg-flip 2.75s cubic-bezier(.3,.1,.18,1) infinite; }
    .clay-hand-left { left:15%; top:53%; width:57%; transform-origin:40% 94%; animation:clay-left 2.8s ease-in-out infinite; }
    .clay-hand-right { right:15%; top:53%; width:53%; transform-origin:60% 94%; animation:clay-right 2.8s ease-in-out infinite; }
    .clay-normal { left:30%; top:44%; width:42%; animation:clay-normal-shape 2.8s cubic-bezier(.35,.05,.65,1) infinite; }
    .clay-stretched { left:13%; top:47%; width:75%; visibility:hidden; animation:clay-stretched-shape 2.8s ease-in-out infinite; }
    .clapper { left:-1.5%; top:8.5%; width:103%; transform-origin:50% 82%; animation:clapper-shake 2.3s ease-in-out infinite; }
    /* An illustration animates only while its own card is hovered or keyboard-focused. */
    .tile:not(:hover):not(:focus-visible) * { animation:none !important; }
    @keyframes typing-left {0%,100%{transform:translateY(0) rotate(0deg)}12%{transform:translateY(-3px) rotate(-1.3deg)}24%{transform:translateY(0)}45%{transform:translateY(-1px)}58%{transform:translateY(0)}78%{transform:translateY(-2px)}}
    @keyframes typing-right {0%,100%{transform:translateY(-1px)}18%{transform:translateY(0)}32%{transform:translateY(-3px) rotate(1deg)}45%{transform:translateY(0)}69%{transform:translateY(-2px)}81%{transform:translateY(0)}}
    @keyframes spin {to{transform:rotate(360deg)}}
    @keyframes dj-scratch {0%,100%{transform:rotate(0)}25%{transform:rotate(32deg)}43%{transform:rotate(-18deg)}67%{transform:rotate(23deg)}85%{transform:rotate(-12deg)}}
    @keyframes dj-hand {0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(2px) rotate(5deg)}43%{transform:translateX(-3px) rotate(-5deg)}67%{transform:translateX(3px) rotate(4deg)}85%{transform:translateX(-1px) rotate(-2deg)}}
    @keyframes balance {0%,100%{transform:rotate(0)}28%{transform:rotate(-1.8deg)}65%{transform:rotate(2deg)}}
    @keyframes ball-spin {to{transform:rotate(360deg)}}
    @keyframes ball-swap {0%,15%{opacity:1;transform:scale(1);filter:blur(0)}20%,95%{opacity:0;transform:scale(.94);filter:blur(1px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
    @keyframes tilt-scope {0%,100%{transform:rotate(0)}22%{transform:rotate(-3deg) translateY(-2px)}57%{transform:rotate(2deg) translateY(1px)}78%{transform:rotate(-1deg)}}
    @keyframes star-twinkle {0%,100%{opacity:.55;transform:scale(.92)}30%{opacity:1;transform:scale(1.12)}66%{opacity:.72;transform:scale(.98)}}
    @keyframes planet-float {0%,100%{transform:translate(0,0) rotate(-3deg)}40%{transform:translate(3px,-4px) rotate(3deg)}75%{transform:translate(-2px,-1px) rotate(0)}}
    @keyframes race-ticker {from{transform:translateX(-50%)}to{transform:translateX(0)}}
    @keyframes steering {0%,100%{transform:rotate(0)}26%{transform:rotate(-9deg)}48%{transform:rotate(-2deg)}72%{transform:rotate(9deg)}88%{transform:rotate(3deg)}}
    @keyframes pan-flip {0%,14%,100%{transform:rotate(0) translateY(0)}32%{transform:rotate(-10deg) translateY(-3px)}43%{transform:rotate(7deg) translateY(1px)}58%{transform:rotate(-2deg)}73%{transform:rotate(0)}}
    @keyframes egg-flip {0%,15%,67%,100%{transform:translateY(0) rotate(0) scale(1)}30%{transform:translateY(-10px) rotate(-40deg) scale(.94)}42%{transform:translateY(-20px) rotate(-110deg) scale(.82)}51%{transform:translateY(-11px) rotate(-260deg) scale(.89)}62%{transform:translateY(0) rotate(-360deg) scale(1)}}
    @keyframes clay-left {0%,12%,95%,100%{transform:translateX(0) rotate(0)}40%,63%{transform:translateX(-11px) rotate(-5deg)}82%{transform:translateX(-3px)}}
    @keyframes clay-right {0%,12%,95%,100%{transform:translateX(0) rotate(0)}40%,63%{transform:translateX(11px) rotate(5deg)}82%{transform:translateX(3px)}}
    @keyframes clay-normal-shape {0%,12%,100%{visibility:visible;transform:scale(1)}35.9%{visibility:visible;transform:scale(1.75,.78)}36%,65.9%{visibility:hidden;transform:scale(1.75,.78)}66%{visibility:visible;transform:scale(1.75,.78)}87%{transform:scale(.96,1.04)}95%,100%{transform:scale(1)}}
    @keyframes clay-stretched-shape {0%,35.9%{visibility:hidden;transform:scale(.98,1)}36%,46%{visibility:visible;transform:scale(1)}58%{visibility:visible;transform:scale(1.035,.96)}65.9%{visibility:visible;transform:scale(1)}66%,100%{visibility:hidden;transform:scale(.98,1)}}
    @keyframes clapper-shake {0%,100%{transform:rotate(0)}14%{transform:rotate(-2.5deg) translateX(-1px)}28%{transform:rotate(2.1deg) translateX(1px)}45%{transform:rotate(-1.2deg)}60%{transform:rotate(1.2deg)}80%{transform:rotate(0)}}
    @media(max-width:585px){.page{padding:20px 12px}.grid{gap:12px;grid-template-columns:repeat(3,min(29vw,152.71px));}.tile{width:min(29vw,152.71px)}}
    @media(prefers-reduced-motion:reduce){.grid * {animation:none !important}}
  </style>
</head>
<body>
  <div class="page">
    <main class="grid" id="hobby-grid" aria-label="Nine animated illustrated hobbies">
      <div class="tile" tabindex="0" aria-label="Hands typing on a laptop">
        <img class="asset backdrop" src="assets/frame-1948759461.png" alt="">
        <img class="asset laptop" src="assets/image-393.png" alt="">
        <img class="asset typing left" src="assets/image-392.png" alt="">
        <img class="asset typing right" src="assets/image-392.png" alt="">
      </div>
      <div class="tile" tabindex="0" aria-label="DJ hand scratching a record">
        <img class="asset backdrop" src="assets/frame-1948759496.png" alt="">
        <img class="asset dj-deck" src="assets/image-377.png" alt="">
        <img class="asset dj-deck disc-left" src="assets/image-377.png" alt="">
        <img class="asset dj-deck disc-right" src="assets/image-377.png" alt="">
        <img class="asset dj-hand" src="assets/image-378.png" alt="">
      </div>
      <div class="tile" tabindex="0" aria-label="A basketball, soccer ball, cricket ball, volleyball and white ball spinning on a finger">
        <img class="asset backdrop" src="assets/frame-1948759497.png" alt="">
        <img class="asset sports-hand" src="assets/image-382.png" alt="">
        <div class="asset ball b1"><img src="assets/image-383.png" alt=""></div>
        <div class="asset ball b2"><img src="assets/image-384.png" alt=""></div>
        <div class="asset ball b3"><img src="assets/image-385.png" alt=""></div>
        <div class="asset ball b4"><img src="assets/image-386.png" alt=""></div>
        <div class="asset ball b5"><img src="assets/image-387.png" alt=""></div>
      </div>
      <div class="tile" tabindex="0" aria-label="A telescope with gently twinkling stars and drifting planets">
        <img class="asset backdrop" src="assets/frame-1948759491.png" alt="">
        <img class="asset space-stars" src="assets/image-354.png" alt="">
        <img class="asset planet" src="assets/image-373.png" alt="">
        <img class="asset asteroid" src="assets/image-372.png" alt="">
        <img class="asset star-a" src="assets/image-371.png" alt="">
        <img class="asset star-b" src="assets/image-374.png" alt="">
        <img class="asset telescope" src="assets/image-370.png" alt="">
      </div>
      <div class="tile" tabindex="0" aria-label="Formula racing cars moving in a looping ticker">
        <img class="asset backdrop" src="assets/frame-1948759494.png" alt="">
        <div class="race-window" aria-hidden="true"><div class="race-track">
          <div class="race-set">
            <img src="assets/race-blue.png" alt=""><img src="assets/race-red.png" alt="">
            <img src="assets/race-white.png" alt=""><img src="assets/race-orange.png" alt="">
          </div>
          <div class="race-set" aria-hidden="true">
            <img src="assets/race-blue.png" alt=""><img src="assets/race-red.png" alt="">
            <img src="assets/race-white.png" alt=""><img src="assets/race-orange.png" alt="">
          </div>
        </div></div>
      </div>
      <div class="tile" tabindex="0" aria-label="Both hands steering around a winding road">
        <img class="asset backdrop" src="assets/frame-1948759498.png" alt="">
        <img class="asset steer-road" src="assets/image-391.png" alt="">
        <div class="steer-hub">
          <img class="asset wheel" src="assets/image-390-v1.png" alt="">
          <img class="asset steer-hands steer-left" src="assets/image-395-v1.png" alt="">
          <img class="asset steer-hands steer-right" src="assets/image-395-v1.png" alt="">
        </div>
      </div>
      <div class="tile" tabindex="0" aria-label="An omelette being flipped in a pan">
        <img class="asset backdrop" src="assets/frame-1948759492.png" alt="">
        <img class="asset pan" src="assets/image-379-v1.png" alt="">
        <img class="asset egg" src="assets/image-380.png" alt="">
      </div>
      <div class="tile" tabindex="0" aria-label="A blob of red clay being stretched and released">
        <img class="asset backdrop" src="assets/frame-1948759495.png" alt="">
        <img class="asset clay-normal" src="assets/image-394-v1.png" alt="">
        <img class="asset clay-stretched" src="assets/image-396.png" alt="">
        <img class="asset clay-hand-left" src="assets/image-388.png" alt="">
        <img class="asset clay-hand-right" src="assets/image-389-v1.png" alt="">
      </div>
      <div class="tile" tabindex="0" aria-label="A movie clapperboard gently shaking from left to right">
        <img class="asset backdrop" src="assets/frame-1948759493.png" alt="">
        <img class="asset clapper" src="assets/image-375-v1.png" alt="">
      </div>
    </main>
  </div>
</body>
</html>
